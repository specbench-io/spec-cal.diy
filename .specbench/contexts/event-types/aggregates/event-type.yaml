invariants:
- id: 01a1259e-72d9-7951-b5e6-bb6a7de7101f
  text: The slug is unique per owner.
  archived: false
- id: 01a1259e-72d9-73a9-abfe-bad82e179792
  text: The title is never empty and the length is at least one minute (at most 1440).
  archived: false
- id: 01a1259e-72d9-717c-9ac3-9d71c0d8d4f5
  text: Seats and a recurring rule cannot both be on.
  archived: false
- id: 01a1259e-72d9-7ac3-a495-f615d844a128
  text: A per-booker limit on upcoming bookings and a recurring rule cannot both be on, and the limit is at least 1.
  archived: false
- id: 01a1259e-72d9-704b-a531-d51f47aa8850
  text: Booking limits and duration limits go up from day to week to month to year.
  archived: false
- id: 01a1259e-72d9-7ff7-91d1-ef3b6fe8da3d
  text: Offset start is zero or more.
  archived: false
- id: 01a1259e-72d9-771d-b925-a9127fada449
  text: Booking question names are unique, and email or phone is always shown and required.
  archived: false
