name: Event Type
bounded-context-id: 01a0f44a-299f-735f-971c-99d5a8815da7
summary: A kind of meeting an Organizer offers for booking, with its own length, locations and booking rules.
description: 'Every in-scope column of the EventType model. Team, organization, round-robin and managed-event columns are left out. The code keeps Event Type flat; only its JSON columns and the PeriodData type group settings, and those are Value Objects here. UI labels: Length is Duration; Minimum Booking Notice is Minimum notice; Period Type and Period are Limit future bookings; Booking Limits is Limit booking frequency; Duration Limits is Limit total booking duration; Max Active Bookings Per Booker is Limit number of upcoming bookings per booker; Max Active Booking Per Booker Offer Reschedule is Offer to reschedule the last booking to the new time slot; Slot Interval is Time-slot intervals; Seats Per Time Slot is Offer seats; Hidden is Hide from profile; Booking Fields is Booking questions.'
