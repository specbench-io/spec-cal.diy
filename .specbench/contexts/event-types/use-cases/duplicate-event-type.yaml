- id: 01a1259f-6630-7958-8d0e-1bc730f28c9f
  text: 'If the original does not exist, refuse: {{outcome:Not Found}}'
  indent: 0
- id: 01a1259f-6630-74f6-aaa7-c9f1981900d0
  text: Copy every setting, location, limit, booking question and the Cal Video settings and destination calendar; leave out webhooks and the Schedule
  indent: 0
- id: 01a1259f-6630-7781-a7ae-4af442529fcf
  text: Give each Private Link a new link with the same expiry and limit, starting at zero uses
  indent: 0
- id: 01a1259f-6630-775a-b734-b00356034927
  text: 'Save the copy: {{outcome:Event Type Duplicated}}'
  indent: 0
- id: 01a1259f-6630-77a2-908a-119b6f037dcd
  text: 'If {{input:Slug}} is taken, refuse: {{outcome:Slug Conflict}}'
  indent: 1
