name: Event Manager
bounded-context-id: 01a0f44a-2a06-7125-8fe2-659328d04ce1
description: EventManager.ts (in packages/features/bookings, created fresh for each Booking). Works out the Organizer's calendar and video apps from their Credentials.
implements: []
methods:
- id: 01a125a3-62af-76c8-89bb-23ff77150552
  name: Create
  description: 
  implements: 
  inputs:
  - id: 01a125a3-62af-78ce-b103-78997787810e
    name: Booking Uid
    type:
      kind: Primitive
      primitive: Text
  - id: 01a125a3-62af-780f-9672-c3c54cf9b49a
    name: Location
    type:
      kind: Primitive
      nullable: true
      primitive: Text
  steps:
  - id: 01a125a3-62af-70cc-b767-550748e2071a
    text: If there is no location and Cal Video is set up, use Cal Video
    indent: 0
  - id: 01a125a3-62af-75d0-87d1-ce24fe49e78e
    text: If the location is Google Meet but the Destination Calendar is not Google, use Cal Video instead
    indent: 0
  - id: 01a125a3-62af-7e11-9bd7-b9db46cb027c
    text: For a video app location, create the meeting in that app with {{method:Apps/Video Api Adapter.Create Meeting}}. If it fails, email the Organizer that the app is broken and fall back to a Cal Video room
    indent: 0
  - id: 01a125a3-62af-733b-b487-53b0b8f13cbd
    text: Create the calendar event with {{method:Calendars/Calendar.Create Event}} in the first Destination Calendar that works, else in the first connected calendar. Hide notes or Attendees if the Event Type asks for it
    indent: 0
  - id: 01a125a3-62af-7497-87b3-9bef5d85ab15
    text: A calendar failure is logged and the Booking carries on
    indent: 0
  - id: 01a125a3-62af-7c84-b31e-1b88d6d450fc
    text: 'Return a Booking Reference for every event and meeting made: {{outcome:Created}}'
    indent: 0
  outcomes:
  - id: 01a125a3-62af-7275-9ee6-499caee54ac0
    name: Created
    success: true
    message: 
    returns: 
  archived: false
- id: 01a125a3-62af-718b-b38a-6ba729bbc5b5
  name: Reschedule
  description: 
  implements: 
  inputs:
  - id: 01a125a3-62af-7c35-b580-b86620e950f7
    name: Booking Uid
    type:
      kind: Primitive
      primitive: Text
  - id: 01a125a3-62af-7eb4-872e-f50dc8866ff3
    name: Original Booking Uid
    type:
      kind: Primitive
      primitive: Text
  steps:
  - id: 01a125a3-62af-76a6-8fcd-f1a398c55c6e
    text: 'If the new Booking needs confirming, delete the old events and meetings and create nothing: {{outcome:Rescheduled}}'
    indent: 0
  - id: 01a125a3-62af-7286-a5c2-e0905ca35829
    text: If the location changed, a reschedule was requested or the Cal Video room has expired (14 days after the end), make a new meeting and update the calendar events
    indent: 0
  - id: 01a125a3-62af-7c6e-8eb4-c0c753eb9ca3
    text: Otherwise update the existing meeting ({{method:Apps/Video Api Adapter.Update Meeting}}) and calendar events ({{method:Calendars/Calendar.Update Event}}) in place
    indent: 0
  - id: 01a125a3-62af-740b-97bf-fe95c2b10471
    text: 'Move the payments to the new Booking: {{outcome:Rescheduled}}'
    indent: 0
  outcomes:
  - id: 01a125a3-62af-7b55-ba98-b1d45f744277
    name: Rescheduled
    success: true
    message: 
    returns: 
  archived: false
