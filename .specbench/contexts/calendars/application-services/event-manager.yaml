    type:
      kind: Primitive
      primitive: Text
  steps:
  - id: 01a125a3-62af-72d0-a4ba-7b9b682cca4e
    text: 'Delete every calendar event ({{method:Calendars/Calendar.Delete Event}}) and video meeting ({{method:Apps/Video Api Adapter.Delete Meeting}}) in the Booking References; failures only give warnings: {{outcome:Deleted}}'
    indent: 0
  outcomes:
  - id: 01a125a3-62af-71c9-8d93-6a3cebb59b56
    name: Deleted
    success: true
    message: 
    returns: 
  archived: false
