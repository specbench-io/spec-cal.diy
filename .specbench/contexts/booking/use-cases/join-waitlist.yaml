name: Join Waitlist
bounded-context-id: 01a0f44a-29ea-7c49-b4aa-b9c9fc1f7573
description: The "Join waitlist" button on a full time on the booking page. No account needed.
use-case-kind: Command
roles:
- 01a0f442-adc1-7f74-9a7a-6b7f3cc9be7d
inputs:
- id: 01a12c3a-90a9-7649-9fdc-5ad6854bba7f
  name: Event Type Id
  type:
    kind: Primitive
    primitive: Id
  archived: false
- id: 01a12c3a-90ab-78ed-a0c7-59458db404ed
  name: Slot Start
  type:
    kind: Primitive
    primitive: Date
  archived: false
- id: 01a12c3a-90ab-7ae3-a792-e2ea0cdd53e9
  name: Name
  type:
    kind: Primitive
    primitive: Text
  archived: false
- id: 01a12c3a-90ab-71ed-872d-28807fe856ae
  name: Email
  type:
    kind: Primitive
    primitive: Text
  archived: false
