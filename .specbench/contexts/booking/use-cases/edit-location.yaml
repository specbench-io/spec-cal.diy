steps:
- id: 01a125a2-2ff9-759f-b84b-6accbce966ed
  text: An empty {{input:New Location}} means Cal Video
  indent: 0
- id: 01a125a2-2ff9-76ea-aaec-24d4467698b7
  text: "If the location is the Organizer's default app and they have none, refuse: {{outcome:No Default App}}"
  indent: 0
- id: 01a125a2-2ff9-785c-9b1d-62d9be79a8c4
  text: 'Update the calendar event and video meeting with {{method:Calendars/Event Manager.Update Location}}; if {{method-outcome:Calendars/Event Manager.Update Location.Update Failed}}, refuse: {{outcome:Update Failed}}'
  indent: 0
- id: 01a125a2-2ff9-7b42-a248-9730653e72d0
  text: Save the new location and the new Booking References (old ones are kept)
  indent: 0
- id: 01a125a2-2ff9-78d0-be52-3036c86ad972
  text: 'Email everyone about the change: {{outcome:Location Updated}}'
  indent: 0
outcomes:
- id: 01a125a2-2ff9-7645-a3c9-0764da7be1a3
  name: Location Updated
  success: true
