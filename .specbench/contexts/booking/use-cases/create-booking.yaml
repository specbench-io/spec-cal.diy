steps:
- id: 01a125a1-6b38-778e-89e6-1068d1e24846
  text: "If someone other than the Organizer is rescheduling within the Event Type's minimum reschedule notice, refuse: {{outcome:Reschedule Not Allowed}}"
  indent: 0
- id: 01a125a1-6b38-73c5-be7c-1ba7f509b68f
  text: "If {{input:Booker Email}} is on the instance's blocked guest list, refuse: {{outcome:Booker Email Blocked}}"
  indent: 0
- id: 01a12561-480d-74da-b740-1b21293ed40e
  text: Start the spam check on the Booker's email straight away, using {{method:Watchlist/Spam Check Service.Start Check}}, so it runs while the other checks happen
  indent: 0
- id: 01a125a1-6b38-7ee7-8d42-8e2255f440fe
  text: If this is not a reschedule, check the Booker's upcoming Bookings with {{method:Booking/Check Active Bookings Limit For Booker.Check Active Bookings Limit For Booker}}
  indent: 0
- id: 01a125a1-6b38-77a4-b316-d10d00089246
  text: 'If {{method-outcome:Booking/Check Active Bookings Limit For Booker.Check Active Bookings Limit For Booker.Booker Limit Exceeded}}, refuse: {{outcome:Booker Limit Exceeded}}'
  indent: 1
- id: 01a125a1-6b38-74a1-8156-900c003cce78
  text: 'If the Event Type requires booker email verification and this is not a reschedule, and no {{input:Verification Code}} was sent, refuse: {{outcome:Email Verification Required}}'
  indent: 0
- id: 01a125a1-6b38-78e9-bc5f-e66bdeed3e40
  text: 'If the code is wrong, refuse: {{outcome:Invalid Verification Code}}'
  indent: 1
- id: 01a125a1-6b38-7773-b4e1-68365ceeda07
  text: 'If the Event Type does not exist, refuse: {{outcome:Event Type Not Found}}'
  indent: 0
- id: 01a125a1-6b38-70fe-8659-22aee625f4d9
  text: 'If the Event Type has both seats and a recurring rule, refuse: {{outcome:Seats With Recurring}}'
  indent: 0
- id: 01a125a1-6b38-72dc-bd0a-53195bac9aed
  text: 'If {{input:Reschedule Uid}} is given, find the original Booking; if there is none, refuse: {{outcome:Original Booking Not Found}}'
  indent: 0
- id: 01a125a1-6b38-795e-85f4-0d2206d7f74d
  text: 'If the original was cancelled without being rescheduled, refuse: {{outcome:Cancelled Booking Cannot Be Rescheduled}}'
  indent: 1
- id: 01a125a1-6b38-7c4c-b85b-28e5c27b1dc6
  text: Decide whether the Booking needs confirming. It is confirmed straight away when the Event Type is free and needs no confirmation, or when the Organizer is rescheduling. The free-email rule replaces Requires Confirmation, and a notice threshold turns it off for Bookings far enough ahead
  indent: 0
- id: 01a125a1-6b38-73e4-a0f7-6fa9350155dc
  text: 'If it needs confirming and the Booker already has an unconfirmed Booking for this Event Type at this time, return that one instead: {{outcome:Already Booked}}'
  indent: 0
- id: 01a125a1-6b38-7f60-a109-166b08829487
  text: 'Check the time with {{method:Availability/Is Out Of Bounds.Is Out Of Bounds}}; if {{method-outcome:Availability/Is Out Of Bounds.Is Out Of Bounds.Booking In Past}}, refuse: {{outcome:Booking In Past}}'
  indent: 0
- id: 01a125a1-6b38-72b4-ae13-57ebab750594
  text: 'If {{method-outcome:Availability/Is Out Of Bounds.Is Out Of Bounds.Booking Time Out Of Bounds}} - inside the Minimum Notice or outside Limit future bookings - refuse: {{outcome:Booking Time Out Of Bounds}}'
  indent: 1
- id: 01a125a1-6b38-774f-86cd-001e18c8c85a
  text: "If the length from {{input:Start}} to {{input:End}} is not the Event Type's length or one of its multiple durations, refuse: {{outcome:Invalid Event Length}}"
  indent: 0
- id: 01a125a1-6b38-791c-b827-df28f867767b
  text: Unless the limits check is skipped, check booking frequency and total duration with {{method:Booking/Check Booking And Duration Limits Service.Check Booking And Duration Limits}}
  indent: 0
- id: 01a125a1-6b38-7b61-8675-6529286dfdff
  text: 'If {{method-outcome:Booking/Check Booking And Duration Limits Service.Check Booking And Duration Limits.Booking Limit Reached}}, refuse: {{outcome:Booking Limit Reached}}'
  indent: 1
- id: 01a125a1-6b38-7978-be1e-022dcab3dc48
  text: 'If {{method-outcome:Booking/Check Booking And Duration Limits Service.Check Booking And Duration Limits.Duration Limit Reached}}, refuse: {{outcome:Duration Limit Reached}}'
  indent: 1
- id: 01a125a1-6b38-77d3-b393-ebf6446b64ab
  text: If a seated Booking already exists at this time, skip the availability check
  indent: 0
- id: 01a125a1-6b38-7ff9-b731-9ab034ab4c0a
  text: 'Otherwise check the Organizer is still free with {{method:Availability/User Availability Service.Get User Availability}}; for a recurring series only the first date is checked. If they are not free, refuse: {{outcome:No Available Users}}'
  indent: 0
- id: 01a125a1-6b38-79dd-b038-e1b4925ca364
  text: Choose the location - the one picked, else the Event Type's first location, else the Organizer's default conferencing app, else Cal Video
  indent: 0
- id: 01a125a1-6b38-7cb5-ac3f-c218ad61d921
  text: Leave out Guests on the blocked guest list and Guests whose own accounts require booker email verification
  indent: 0
- id: 01a10d66-4dd6-7418-a2ee-0e99de0625c8
  text: Before saving the Booking, wait for the spam check to finish, using {{method:Watchlist/Spam Check Service.Wait For Check}}
  indent: 0
- id: 01a10d66-4dd7-7876-ad6b-4ddf2678d16b
  text: 'If {{method-outcome:Watchlist/Spam Check Service.Wait For Check.Blocked}}, show the Booker a Decoy Booking and save nothing: {{outcome:Decoy Booking}}'
  indent: 1
- id: 01a125a1-6b38-7856-b7fb-1e0fe8f3a553
  text: 'For a seated Event Type with a Booking at this time, add the Booker to it instead. If they already have a seat, refuse: {{outcome:Already Signed Up}}'
  indent: 0
- id: 01a125a1-6b38-7ac5-947d-026e3e2beb41
  text: 'If every seat is taken, refuse: {{outcome:Booking Seats Full}}'
  indent: 1
- id: 01a125a1-6b38-7b72-8e0d-4fcee3553856
  text: Save the Booking with its Attendees - Accepted when confirmed straight away, otherwise Pending. When rescheduling, mark the original Cancelled and Rescheduled in the same transaction
  indent: 0
- id: 01a125a1-6b38-7104-9052-6fbabdf8cf51
  text: 'If an accepted Booking already exists for this Organizer at the same time, refuse: {{outcome:Booking Conflict}}'
  indent: 1
- id: 01a125a1-6b38-7b7c-bef6-7b3f60513b22
  text: If rescheduling, move the calendar events and video meeting with {{method:Calendars/Event Manager.Reschedule}} and send rescheduled emails with {{method:Notifications/Booking Email Sms Handler.Send Rescheduled}}
  indent: 0
- id: 01a125a1-6b38-7515-a0aa-3e19c7e686f3
  text: If confirmed straight away, create the calendar events and video meeting with {{method:Calendars/Event Manager.Create}} and send the scheduled emails with {{method:Notifications/Booking Email Sms Handler.Send Confirmed}}
  indent: 0
- id: 01a125a1-6b38-71df-b369-225571fd1038
  text: If it needs confirming and no payment is due, send the request emails with {{method:Notifications/Booking Email Sms Handler.Send Requested}}
  indent: 0
- id: 01a125a1-6b38-7f1c-8a95-3cdca74bdd96
  text: Count the use of the Private Link the Booker came through with {{method:Event Types/Hashed Link Service.Validate And Increment Usage}}
  indent: 0
- id: 01a125a1-6b38-7567-a421-2bd7e6c2eb4d
  text: 'If the Event Type has a price and the original was not already paid, start the payment. If there is no payment app set up, refuse: {{outcome:Missing Payment Credentials}}'
  indent: 0
- id: 01a125a1-6b38-74cb-a9c7-ca7a16b640d3
  text: 'Publish {{integration-event:Booking/Booking Payment Initiated}} and stop here: {{outcome:Awaiting Payment}}'
  indent: 1
- id: 01a125a1-6b38-7a26-ac06-fc904c9e4037
  text: 'If confirmed straight away, store the meeting started and ended triggers, publish {{integration-event:Booking/Booking Created}} - or {{integration-event:Booking/Booking Rescheduled}} for a reschedule - and schedule the Cal Video no-show checks: {{outcome:Booked}}'
  indent: 0
- id: 01a125a1-6b38-76ff-a0e2-ea0c4c453c74
  text: 'Otherwise queue {{integration-event:Booking/Booking Requested}}: {{outcome:Awaiting Confirmation}}'
  indent: 0
outcomes:
