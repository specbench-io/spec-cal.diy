name: Create Booking
bounded-context-id: 01a0f44a-29ea-7c49-b4aa-b9c9fc1f7573
description: "POST /api/book/event, which runs RegularBookingService.createBooking. Also used for rescheduling: the booking page sends the original Booking's uid. Before it runs, the web route checks bots, rate limits and Turnstile."
use-case-kind: Command
roles:
- 01a0f442-adc1-7f74-9a7a-6b7f3cc9be7d
