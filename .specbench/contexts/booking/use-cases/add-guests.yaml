steps:
- id: 01a125a2-2fce-71de-8670-f9e335f5eb59
  text: 'If the Booking does not exist, refuse: {{outcome:Booking Not Found}}'
  indent: 0
- id: 01a125a2-2fce-7041-b5d4-3bb1ce8fa90d
  text: 'If the person is neither the Organizer nor an Attendee, refuse: {{outcome:No Permission}}'
  indent: 0
- id: 01a125a2-2fce-7f84-9db0-b5156912fdfb
  text: 'Remove duplicates, existing Attendees, blocked emails and accounts that need booker email verification; if no one is left, refuse: {{outcome:Emails Must Be Unique}}'
  indent: 0
- id: 01a125a2-2fce-7a31-9d4b-0b10a09e2f4a
  text: Add the Guests as Attendees and to the booking answers
  indent: 0
- id: 01a125a2-2fce-7652-be2e-0bc34fbfc204
  text: 'Add them to the calendar event with {{method:Calendars/Event Manager.Update Calendar Attendees}} and email everyone with {{method:Notifications/Booking Email Sms Handler.Send Add Guests}}: {{outcome:Guests Added}}'
  indent: 0
