revision: 47
title: Joining a waitlist
intent: As a Booker, I want to join a waitlist for a time that is already booked, so that I can still get that time if it frees up.
description: Organizers get cancelled times filled again without doing anything. When a time frees up, the first person in line is emailed and has a set time to claim it. If they don't, the next person gets the offer. The Organizer switches the waitlist on for each Event Type.
