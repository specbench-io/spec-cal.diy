spec-format: 1
kind: feature
id: 01a125e3-1fe3-7605-986b-399a906f0bb6
revision: 63
title: Signing up and logging in
intent: As a User, I want to create an account and sign in to it securely, so that only I can manage my bookings and availability.
description: 'Use Cases: Sign Up, Verify Email, Log In, Log In With Google, Forgot Password, Send Password Reset, Reset Password, Enable Two Factor, Lock User Account, Complete Onboarding.'
scenarios:
- id: 01a125e3-1fe4-7e82-bcd9-ddca4c2bc964
  title: Sign up is refused for a weak password or a taken username
  steps:
  - id: 01a125e3-1fe4-747e-aeca-541ef219449d
    keyword: Given
    text: a User with the username "alex" already exists
    archived: false
  - id: 01a125e3-1fe4-7962-8c7b-eddf58853673
    keyword: And
    text: a visitor is on the sign up page
    archived: false
  - id: 01a125e3-1fe4-7970-9af6-2a7b7f3d2722
    keyword: When
    text: they enter the password "abcdefg"
    archived: false
  - id: 01a125e3-1fe4-7983-a83b-d5990f876581
    keyword: Then
    text: the password hints "Mix of uppercase & lowercase letters" and "Contain at least 1 number" stay unmet
    archived: false
  - id: 01a125e3-1fe4-7741-a1fd-c9350451dc25
    keyword: When
    text: they change the password to "Abcdef1"
    archived: false
  - id: 01a125e3-1fe4-77d4-8157-eae485905227
    keyword: Then
    text: all three hints are met, including "Minimum 7 characters long"
    archived: false
  - id: 01a125e3-1fe4-78da-a708-3e63a2b52b8f
    keyword: When
    text: they sign up with the username "alex", a new email address and that password
    archived: false
  - id: 01a125e3-1fe4-7368-8108-1e3604d6ced1
    keyword: Then
    text: the sign up page shows "Username or email is already taken"
    archived: false
  - id: 01a125e3-1fe4-70ae-9cee-75a6be992438
    keyword: And
    text: no new account is created
    archived: false
  archived: false
- id: 01a125e3-1fe4-7564-806a-87598c1f79f7
  title: Verifying the email address leads into onboarding
  steps:
  - id: 01a125e3-1fe4-733b-931b-a464a0b71d07
    keyword: Given
    text: email verification is turned on for the instance
    archived: false
  - id: 01a125e3-1fe4-7461-948c-0d9daaf68aa9
    keyword: When
    text: a visitor signs up
    archived: false
  - id: 01a125e3-1fe4-7ef1-9ed7-6006a241a8f3
    keyword: Then
    text: they are sent an email with a verification link that works for one day
    archived: false
  - id: 01a125e3-1fe4-7ac3-ad41-2be6ea933412
    keyword: When
    text: the User opens the verification link
    archived: false
  - id: 01a125e3-1fe4-7b41-8cd9-347c0de76ed7
    keyword: Then
    text: their email address is marked as verified
    archived: false
  - id: 01a125e3-1fe4-753e-9d49-a56915c7ecaf
    keyword: And
    text: they are taken to the first onboarding step, "Welcome to Cal.diy!"
    archived: false
  - id: 01a125e3-1fe4-7390-83ec-64ccff82ca1a
    keyword: When
    text: the User opens a verification link that is more than a day old
    archived: false
  - id: 01a125e3-1fe4-75f6-bc4e-30e6ef6e17d2
    keyword: Then
    text: they see the message "Token expired"
    archived: false
  archived: false
- id: 01a125e3-1fe4-702e-967c-3345ef317a21
  title: A wrong password never reveals whether the email is registered
  steps:
  - id: 01a125e3-1fe4-78d4-af42-d9947923217e
    keyword: Given
    text: a User has an account with a password
    archived: false
  - id: 01a125e3-1fe4-7752-a64d-354660102ab5
    keyword: When
    text: they log in with their email and a wrong password
    archived: false
  - id: 01a125e3-1fe4-725b-8d6c-8fea455af6d4
    keyword: Then
    text: they see "Email or password is incorrect."
    archived: false
  - id: 01a125e3-1fe4-74d7-b0f7-a2f6bd306509
    keyword: When
    text: someone logs in with an email that has no account
    archived: false
  - id: 01a125e3-1fe4-77c5-af94-147a6f2453aa
    keyword: Then
    text: they see the same message "Email or password is incorrect."
    archived: false
  archived: false
- id: 01a125e3-1fe4-7c26-8ee4-136d17bf2cc8
