    keyword: Given
    text: a User is going through onboarding
    archived: false
  - id: 01a125e3-1fe4-77c7-bb36-cfdbbbcb591c
    keyword: Then
    text: 'they move through five steps: their settings, connecting a calendar, connecting a video app, setting their availability, and their profile'
    archived: false
  - id: 01a125e3-1fe4-7f4d-ad79-3aef1043ecfe
    keyword: And
    text: they can skip connecting a calendar with "I'll connect my calendar later"
    archived: false
  - id: 01a125e3-1fe4-7293-8477-b371ae01f8ef
    keyword: When
