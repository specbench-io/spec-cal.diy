    text: the User opens an expired reset link
    archived: false
  - id: 01a125e3-1fe4-7606-a37d-a913b2d4d1db
    keyword: Then
    text: they see "That request is expired."
    archived: false
  - id: 01a125e3-1fe4-7729-9f9f-a32110c540b9
    keyword: When
    text: the User sets a new password with a valid reset link
    archived: false
  - id: 01a125e3-1fe4-7402-ae10-68686071437a
    keyword: Then
    text: they see "Password updated!"
    archived: false
  - id: 01a125e3-1fe4-720d-9502-a79302c4d862
    keyword: And
    text: their email address is marked as verified
    archived: false
  - id: 01a125e3-1fe4-7a2c-892d-61af9c34983e
    keyword: And
    text: the same link cannot be used again
    archived: false
  archived: false
- id: 01a125e3-1fe4-7ff0-b8c6-f5d2c2bda14c
  title: Finishing onboarding creates starter event types
  steps:
