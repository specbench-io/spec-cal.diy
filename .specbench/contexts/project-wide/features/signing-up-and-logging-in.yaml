    text: a User has turned on Two-Factor Authentication
    archived: false
  - id: 01a125e3-1fe4-7f59-b6b9-0a4fadf53498
    keyword: When
    text: they log in with the correct email and password
    archived: false
  - id: 01a125e3-1fe4-7794-8d24-542df531dbe0
    keyword: Then
    text: the login form asks for their "Two-factor code"
    archived: false
  - id: 01a125e3-1fe4-73c0-b1c0-d0aa066185a7
    keyword: When
    text: they enter a wrong code
    archived: false
  - id: 01a125e3-1fe4-7bc1-96a5-60f1a82d53a2
    keyword: Then
    text: they see "Two-factor code is incorrect. Please try again."
    archived: false
  - id: 01a125e3-1fe4-76eb-88f0-0e96d3405e0d
    keyword: When
    text: they enter the current code from their authenticator app
    archived: false
  - id: 01a125e3-1fe4-7962-829d-2d11e89e952b
    keyword: Then
    text: they are logged in
    archived: false
  archived: false
- id: 01a125e3-1fe4-7773-a2f1-5574d03bee4e
  title: A locked account cannot log in
  steps:
  - id: 01a125e3-1fe4-7145-b750-3047fbf7a6d0
    keyword: Given
    text: an Admin has locked a User's account
    archived: false
  - id: 01a125e3-1fe4-7311-9f27-d1f0a34bc26c
    keyword: When
    text: the User logs in with the correct email and password
    archived: false
  - id: 01a125e3-1fe4-7ee4-a20d-15d521300f44
    keyword: Then
    text: they see "Email or password is incorrect.", the same as for a wrong password
    archived: false
  - id: 01a125e3-1fe4-71fe-a799-b446f53cd863
    keyword: And
    text: they are not logged in
    archived: false
  - id: 01a125e3-1fe4-74d4-ba1e-361af90fd468
    keyword: When
    text: the Admin unlocks the account
    archived: false
  - id: 01a125e3-1fe4-7146-80a8-e7a2d2a73007
    keyword: Then
    text: the User can log in again
    archived: false
  archived: false
- id: 01a125e3-1fe4-71c5-9cf4-45b1863c4b72
  title: Password reset links expire
  steps:
  - id: 01a125e3-1fe4-7a83-81b1-d4deb6176133
    keyword: Given
    text: a User has requested a password reset
    archived: false
  - id: 01a125e3-1fe4-7f12-acd2-73a1d7834f9e
    keyword: Then
    text: they see "Reset link sent"
    archived: false
  - id: 01a125e3-1fe4-7ac1-88c1-336d4c9f58ca
    keyword: And
    text: they are emailed a reset link that works for 6 hours
    archived: false
  - id: 01a125e3-1fe4-77f8-a188-e09141300135
    keyword: When
    text: the User requests another password reset
    archived: false
  - id: 01a125e3-1fe4-77c5-b887-8c6edc863603
    keyword: Then
    text: the earlier reset link stops working
    archived: false
  - id: 01a125e3-1fe4-7ecb-a951-86d3d0af47b0
