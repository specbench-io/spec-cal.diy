spec-format: 1
kind: feature
id: 01a125e0-1a29-7463-9631-92a68f4e6021
revision: 52
title: Sharing Private Links
intent: As an Organizer, I want to share Private Links to an Event Type that expire by date or by number of uses, so that only the people I choose can book me, and only for as long as I allow.
description: 'Use Cases: Book Through Private Link, Update Event Type. Service: Hashed Link Service.'
scenarios:
- id: 01a125e0-1a29-7d96-9bae-5741c69c9849
  title: A new Private Link is single use unless the Organizer changes it
  steps:
  - id: 01a125e0-1a29-72c1-b2e9-aebf43eba787
    keyword: Given
    text: the Organizer has switched on "Private links" for an Event Type
    archived: false
  - id: 01a125e0-1a29-7520-b9c0-8928f2cffef1
    keyword: When
    text: they choose "Add new link"
    archived: false
  - id: 01a125e0-1a29-77ce-916f-ecdb75fa0b1b
    keyword: Then
    text: a new Private Link is added that can be used for one booking
    archived: false
  - id: 01a125e0-1a29-77f9-8c91-027f3d7b73fc
    keyword: And
    text: the link shows "1 of 1 use left"
    archived: false
  - id: 01a125e0-1a29-71df-8739-2e7608cd22eb
    keyword: When
    text: the Organizer saves the Event Type
    archived: false
  - id: 01a125e0-1a29-731b-ae10-62bfaf9c3888
    keyword: Then
    text: the Event Types list shows a "Copy private link to event" button for that Event Type
    archived: false
  - id: 01a125e0-1a29-7d00-982c-6631addcd0ab
    keyword: And
    text: clicking it shows "Private link copied!"
    archived: false
  archived: false
