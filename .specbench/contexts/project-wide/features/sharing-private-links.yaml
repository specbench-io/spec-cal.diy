    keyword: Then
    text: they get a page-not-found instead of the booking page
    archived: false
  - id: 01a125e0-9ace-771b-889f-564613370f32
    keyword: And
    text: the Organizer sees "This link expired on Mar 10, 2027, end of day" for that link
    archived: false
  archived: false
