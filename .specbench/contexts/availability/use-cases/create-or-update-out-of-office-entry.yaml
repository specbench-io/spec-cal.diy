steps:
- id: 01a1259d-7d7d-75ea-a63c-00c613acc705
  text: 'If either date is missing, refuse: {{outcome:Dates Required}}'
  indent: 0
- id: 01a1259d-7d7d-73b9-90c7-14d20bbca403
  text: 'Stretch the dates to whole days; if the start is after the end, refuse: {{outcome:Start After End}}'
  indent: 0
- id: 01a1259d-7d7d-7dca-8452-f3666cf92a85
  text: 'If the entry would redirect to the Organizer themselves or to someone they share no team with, refuse: {{outcome:Invalid Redirect}}'
  indent: 0
- id: 01a1259d-7d7d-7933-8a42-c74777a80eda
  text: 'If another entry already has exactly the same start and end, refuse: {{outcome:Already Exists}}'
  indent: 0
- id: 01a1259d-7d7d-75ad-9d10-4a9e2363b86e
  text: Save the entry, creating a new id if it is new
  indent: 0
- id: 01a1259d-7d7d-7e40-b6b8-ef20f499a2b0
  text: Email the redirect target about the redirect being added, changed or cancelled
  indent: 0
- id: 01a1259d-7d7d-7afc-8f9a-7d69da30eebf
  text: 'Publish {{integration-event:Availability/Out Of Office Created}} (also on update): {{outcome:Entry Saved}}'
  indent: 0
