steps:
- id: 01a1259d-7e2f-7a71-b1f1-b439394093eb
  text: Identify the Booker by their browser cookie, or give them a new one
  indent: 0
- id: 01a1259d-7e2f-7de3-8b1a-ef20ec005a9e
  text: 'If the Event Type does not exist, refuse: {{outcome:Event Type Not Found}}'
  indent: 0
- id: 01a1259d-7e2f-7775-81d6-0df34fdbc74b
  text: For a seated Event Type, only hold the Slot when a Booking already exists there with seats left
  indent: 0
- id: 01a1259d-7e2f-747d-8982-5655400a331c
  text: 'If another Booker already holds the Slot, do nothing: {{outcome:Reserved}}'
  indent: 0
- id: 01a1259d-7e2f-7db5-a8f2-338a0813efe5
  text: 'Otherwise hold the Slot for each Organizer of the Event Type until now plus five minutes (MINUTES_TO_BOOK): {{outcome:Reserved}}'
  indent: 0
