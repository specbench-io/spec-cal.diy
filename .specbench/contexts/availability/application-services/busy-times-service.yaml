  steps:
  - id: 01a1259c-c1ca-7ea8-9062-63833354e973
    text: Block each of the Organizer's accepted Bookings from its start minus the buffers to its end plus the buffers (its own buffers plus this Event Type's)
    indent: 0
  - id: 01a1259c-c1ca-7bbc-aeca-4c500e75a42d
    text: For seated Bookings of this Event Type that still have seats, block only the buffers
    indent: 0
  - id: 01a1259c-c1ca-741b-ad2c-04083f945e1e
    text: Skip the Booking being rescheduled ({{input:Reschedule Uid}})
    indent: 0
  - id: 01a1259c-c1ca-7638-a8f3-c36e0faa3fe9
    text: Add busy times from the Organizer's connected calendars ({{method:Calendars/Calendar.Get Availability}}), widened by this Event Type's buffers, minus open seats. The {{input:Mode}} decides whether the calendar cache may answer
    indent: 0
  - id: 01a1259c-c1ca-758f-af3a-fe92922d15f9
    text: 'If a calendar cannot be read, fail unless calendar failures are set to be silent: {{outcome:Calendar Failure}}'
    indent: 0
  - id: 01a1259c-c1ca-7994-91b3-b70c1a8090c0
    text: 'Return all the busy times: {{outcome:Busy Times}}'
    indent: 0
