steps:
- id: 01a125a7-3aee-783c-b0c7-43634092dd83
  text: 'If the account signs in with Google and has no password, refuse: {{outcome:Third Party Provider}}'
  indent: 0
- id: 01a125a7-3aee-77be-9f22-d734a63f0b0c
  text: 'If two-factor is already on, refuse: {{outcome:Already Enabled}}'
  indent: 0
- id: 01a125a7-3aee-7376-b72d-ebb37802630c
  text: 'If {{input:Password}} is wrong, refuse: {{outcome:Incorrect Password}}'
  indent: 0
- id: 01a125a7-3aee-793a-bdb7-bc74727fe759
  text: Store an encrypted secret and ten backup codes, and show the QR code and codes
  indent: 0
- id: 01a125a7-3aee-702a-a464-f7b360ce90b5
  text: 'If {{input:Code}} from the authenticator is wrong, refuse: {{outcome:Incorrect Code}}'
  indent: 0
- id: 01a125a7-3aee-7ca8-92cb-f2577630b18a
  text: 'Switch two-factor on: {{outcome:Enabled}}'
  indent: 0
