steps:
- id: 01a125a7-3ba7-74dc-afb4-17d71f72200e
  text: 'If the current password does not meet the password rule (strict for Admins), refuse: {{outcome:Password Policy Violation}}'
  indent: 0
- id: 01a125a7-3ba7-708c-a110-f5b90a09b6da
  text: 'If {{input:Password}} is wrong, refuse: {{outcome:Incorrect Password}}'
  indent: 0
- id: 01a125a7-3ba7-735a-ab36-d6f395670d8d
  text: 'If two-factor is on and the code is missing or wrong, refuse: {{outcome:Incorrect Two Factor Code}}'
  indent: 0
- id: 01a125a7-3ba7-7691-a1e1-9f8d6123712d
  text: 'Delete the Stripe customer, then delete the user and everything that cascades from it: {{outcome:Account Deleted}}'
  indent: 0
