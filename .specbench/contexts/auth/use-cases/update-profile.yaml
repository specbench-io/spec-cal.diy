steps:
- id: 01a125a7-3b79-7870-a425-069292c3aaef
  text: 'If the new username is not available, refuse: {{outcome:Username Taken}}'
  indent: 0
- id: 01a125a7-3b79-7685-a545-c5d6430f84a6
  text: If email verification is on and the new email is not a verified secondary email, keep the old email until the change is confirmed by link; otherwise switch now
  indent: 0
- id: 01a125a7-3b79-7e28-8118-97a942658949
  text: Save an uploaded avatar, and replace the Travel Schedules
  indent: 0
- id: 01a125a7-3b79-750e-ab23-153650917aef
  text: 'If the new email is used by someone else, refuse: {{outcome:Email Already Used}}'
  indent: 0
- id: 01a125a7-3b79-7cf8-a2a9-2d4ec9fc42d1
  text: "On a time zone change, update the Default Schedule's time zone too: {{outcome:Settings Updated}}"
  indent: 0
