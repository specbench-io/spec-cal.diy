steps:
- id: 01a125a7-3a96-7e31-a4b8-923d84158a7e
  text: If no user exists yet, send the visitor to instance setup
  indent: 0
- id: 01a125a7-3a96-7c01-83e6-95c81558d8ab
  text: 'If no unlocked user has {{input:Email}}, or the password is wrong, refuse: {{outcome:Incorrect Email Password}}'
  indent: 0
- id: 01a125a7-3a96-773e-8354-96999c93da0f
  text: 'If two-factor is on and no code was given, ask for it: {{outcome:Second Factor Required}}'
  indent: 0
- id: 01a125a7-3a96-7857-aed1-272c2ec76b06
  text: 'If the code or backup code is wrong, refuse: {{outcome:Incorrect Two Factor Code}}'
  indent: 0
- id: 01a125a7-3a96-798d-a17a-bb583db9c4e9
  text: An Admin without a strong password and two-factor is signed in as an inactive admin and shown a warning
  indent: 0
- id: 01a125a7-3a96-7672-913b-1563044c53e8
  text: "Start a session, lasting the user's session timeout if set: {{outcome:Logged In}}"
  indent: 0
