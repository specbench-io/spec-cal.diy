  archived: false
steps:
- id: 01a125a7-3a66-7a90-9005-073de4c3f5a9
  text: 'If there is no token or it has expired, refuse: {{outcome:Invalid Token}}'
  indent: 0
- id: 01a125a7-3a66-7b69-a3b3-38c7f3239d78
  text: 'For a secondary email, mark it verified and go to the profile settings: {{outcome:Verified}}'
  indent: 0
- id: 01a125a7-3a66-7f17-a0a8-e7d002b48126
  text: 'For a pending change of email, if another user has the new address, refuse: {{outcome:Email Taken}}'
  indent: 0
- id: 01a125a7-3a66-77ad-8ac7-0dec41c5f0ec
  text: 'Otherwise switch to the new address: {{outcome:Verified}}'
  indent: 1
- id: 01a125a7-3a66-7887-9758-1a6827aaedae
  text: 'Otherwise mark the email verified and continue to onboarding or Event Types: {{outcome:Verified}}'
  indent: 0
