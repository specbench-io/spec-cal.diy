  steps:
  - id: 01a125a7-39ff-7191-bae5-9a8045beac91
    text: 'If the client was rejected, refuse: {{outcome:Client Rejected}}'
    indent: 0
  - id: 01a125a7-39ff-7c51-81a2-763914684fe9
    text: A pending client can only be used by its owner
    indent: 0
  - id: 01a125a7-39ff-7a78-9c81-f9704789f3a4
    text: "If {{input:Redirect Uri}} is not exactly the client's, refuse: {{outcome:Redirect Mismatch}}"
    indent: 0
  - id: 01a125a7-39ff-79e3-aff9-0ec8623d5804
    text: A public client must send a PKCE challenge
    indent: 0
  - id: 01a125a7-39ff-71c4-897c-2da363799529
    text: 'Store an Access Code valid for 10 minutes and send the user back with it: {{outcome:Code Issued}}'
    indent: 0
  outcomes:
